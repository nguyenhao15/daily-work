<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Container nét vẽ tự điều chỉnh theo chế độ sáng/tối -->
  <g fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cột trái của chữ N -->
    <line x1="50" y1="40" x2="50" y2="160" />
    
    <!-- Đường chéo nối chữ N chuyển tiếp sang chữ H -->
    <line x1="50" y1="40" x2="110" y2="160" />
    
    <!-- Cột giữa chung cho N và H -->
    <line x1="110" y1="40" x2="110" y2="160" />
    
    <!-- Thanh ngang liên kết chữ H -->
    <line x1="110" y1="100" x2="150" y2="100" />
    
    <!-- Cột phải của chữ H -->
    <line x1="150" y1="40" x2="150" y2="160" />
  </g>
</svg>
